<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>任务管理</title>
  <style>
    :root {
      /* 浅色主题变量 */
      --primary-color: #2563eb;
      --primary-hover: #1d4ed8;
      --border-color: #e5e7eb;
      --bg-color: #ffffff;
      --bg-gray: #f3f4f6;
      --text-color: #111827;
      --text-secondary: #4b5563;
      --card-bg: #ffffff;
      --log-bg: #f3f4f6;
      --btn-bg: #ffffff;
      --btn-border: #e5e7eb;
      --radius: 6px;
    }

    /* 深色主题变量 */
    [data-theme="dark"] {
      --primary-color: #3b82f6;
      --primary-hover: #60a5fa;
      --border-color: #374151;
      --bg-color: #111827;
      --bg-gray: #1f2937;
      --text-color: #f9fafb;
      --text-secondary: #9ca3af;
      --card-bg: #1f2937;
      --log-bg: #111827;
      --btn-bg: #374151;
      --btn-border: #4b5563;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
        "Helvetica Neue", Arial, sans-serif;
      color: var(--text-color);
      line-height: 1.5;
      padding: 20px;
      background-color: var(--bg-color);
      transition: background-color 0.3s ease, color 0.3s ease;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: var(--radius);
      padding: 24px;
      transition: background-color 0.3s ease, border-color 0.3s ease;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--border-color);
    }

    h1 {
      font-size: 24px;
      margin: 0;
    }

    .theme-toggle {
      background: none;
      border: 1px solid var(--border-color);
      color: var(--text-color);
      padding: 8px 12px;
      border-radius: var(--radius);
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 14px;
      transition: all 0.2s ease;
    }

    .theme-toggle:hover {
      background-color: var(--bg-gray);
    }

    .theme-toggle svg {
      width: 16px;
      height: 16px;
    }

    .document-selector {
      margin-bottom: 24px;
    }

    .document-selector h2 {
      font-size: 14px;
      margin-bottom: 12px;
      color: var(--text-secondary);
    }

    .radio-group {
      display: flex;
      flex-wrap: wrap;
      gap: 16px;
    }

    .radio-item {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .radio-item input[type="radio"] {
      appearance: none;
      width: 16px;
      height: 16px;
      border: 2px solid var(--border-color);
      border-radius: 50%;
      margin: 0;
      cursor: pointer;
      position: relative;
      transition: border-color 0.2s ease;
    }

    .radio-item input[type="radio"]:checked {
      border-color: var(--primary-color);
    }

    .radio-item input[type="radio"]:checked::after {
      content: "";
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background-color: var(--primary-color);
      transition: background-color 0.2s ease;
    }

    .radio-item label {
      font-size: 14px;
      cursor: pointer;
      color: var(--text-color);
    }

    .button-group {
      display: flex;
      gap: 12px;
      margin-bottom: 24px;
      flex-wrap: wrap;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 8px 16px;
      border: 1px solid var(--btn-border);
      background-color: var(--btn-bg);
      color: var(--text-color);
      border-radius: var(--radius);
      font-size: 14px;
      cursor: pointer;
      transition: all 0.2s ease;
      gap: 8px;
    }

    .btn .icon {
      transition: transform 0.2s ease;
    }

    .btn:hover .icon {
      transform: scale(1.1);
    }

    .btn:hover {
      background-color: var(--bg-gray);
    }

    .btn-small {
      padding: 4px 10px;
      font-size: 12px;
    }

    .log-wrapper {
      position: relative;
    }

    .log-clear-btn {
      position: absolute;
      top: 8px;
      right: 8px;
      z-index: 10;
      opacity: 0.85;
      background-color: var(--card-bg);
    }

    .log-clear-btn:hover {
      opacity: 1;
      background-color: var(--bg-gray);
    }

    .preview-link {
      color: var(--primary-color);
      text-decoration: underline;
      word-break: break-all;
    }

    .preview-link:hover {
      color: var(--primary-hover);
    }

    .log-status {
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--text-secondary);
      margin-top: 4px;
    }

    .log-spinner {
      display: inline-block;
      width: 12px;
      height: 12px;
      border: 2px solid var(--border-color);
      border-top-color: var(--primary-color);
      border-radius: 50%;
      animation: log-spin 0.8s linear infinite;
    }

    @keyframes log-spin {
      to {
        transform: rotate(360deg);
      }
    }

    .log-container {
      background-color: var(--log-bg);
      border: 1px solid var(--border-color);
      border-radius: var(--radius);
      padding: 16px;
      height: 400px;
      overflow-y: auto;
      transition: background-color 0.3s ease, border-color 0.3s ease;
    }

    .log-content {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas,
        monospace;
      font-size: 13px;
      white-space: pre-wrap;
      line-height: 1.6;
      color: var(--text-color);
    }

    .log-container::-webkit-scrollbar {
      width: 8px;
    }

    .log-container::-webkit-scrollbar-track {
      background: var(--bg-gray);
      border-radius: 4px;
    }

    .log-container::-webkit-scrollbar-thumb {
      background: var(--border-color);
      border-radius: 4px;
    }

    .log-container::-webkit-scrollbar-thumb:hover {
      background: var(--text-secondary);
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .proxy-mask {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.45);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      z-index: 100;
    }

    .proxy-mask[hidden] {
      display: none;
    }

    .proxy-panel {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: var(--radius);
      width: 420px;
      max-width: 100%;
      overflow: hidden;
    }

    .proxy-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 20px;
      border-bottom: 1px solid var(--border-color);
    }

    .proxy-head h2 {
      font-size: 16px;
      margin: 0;
    }

    .proxy-body {
      padding: 16px 20px;
    }

    .proxy-field {
      display: flex;
      flex-direction: column;
      gap: 6px;
      font-size: 13px;
      color: var(--text-secondary);
    }

    .proxy-field input {
      width: 100%;
      padding: 8px 10px;
      border: 1px solid var(--btn-border);
      border-radius: var(--radius);
      background: var(--btn-bg);
      color: var(--text-color);
      font-size: 13px;
    }

    .proxy-actions {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 10px;
      padding: 14px 20px;
      border-top: 1px solid var(--border-color);
    }

    .proxy-msg {
      flex: 1;
      font-size: 12px;
      color: var(--text-secondary);
      word-break: break-all;
    }

    .proxy-msg.error {
      color: #dc2626;
    }


    @media (max-width: 640px) {
      .container {
        padding: 16px;
      }

      .radio-group {
        gap: 12px;
      }

      .button-group {
        gap: 8px;
      }

      .btn {
        padding: 6px 12px;
      }

      .theme-toggle span {
        display: none;
      }
    }
  </style>
</head>

<body>
  <div class="container">
    <div class="header">
      <h1>文档任务管理</h1>
      <div class="header-actions">
        <button class="theme-toggle" id="proxyButton" aria-label="代理设置">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <circle cx="12" cy="12" r="9"></circle>
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3.6 9h16.8M3.6 15h16.8" />
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M12 3c2.5 2.5 3.8 5.6 3.8 9s-1.3 6.5-3.8 9c-2.5-2.5-3.8-5.6-3.8-9S9.5 5.5 12 3z" />
          </svg>
          <span>代理</span>
        </button>
        <button class="theme-toggle" id="themeToggle" aria-label="切换主题">
        <!-- 月亮图标 (深色主题) -->
        <svg class="moon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z" />
        </svg>
        <!-- 太阳图标 (浅色主题) -->
        <svg class="sun" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z" />
        </svg>
        <span>切换主题</span>
        </button>
      </div>
    </div>

    <div class="document-selector">
      <h2>选择操作的文档:</h2>
      <div class="radio-group" id="docsGroup"></div>
    </div>

    <div class="button-group">
      <button class="btn" id="pullButton">
        <svg class="icon" viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" fill="none" stroke-width="2"
          stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
          <polyline points="7 10 12 15 17 10"></polyline>
          <line x1="12" y1="15" x2="12" y2="3"></line>
        </svg>
        拉取
      </button>
      <button class="btn" id="buildButton">
        <svg class="icon" viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" fill="none" stroke-width="2"
          stroke-linecap="round" stroke-linejoin="round">
          <line x1="16.5" y1="9.4" x2="7.5" y2="4.21"></line>
          <path
            d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z">
          </path>
          <polyline points="3.27 6.96 12 12.01 20.73 6.96"></polyline>
          <line x1="12" y1="22.08" x2="12" y2="12"></line>
        </svg>
        打包
      </button>
      <button class="btn" id="previewButton">
        <svg class="icon" viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" fill="none" stroke-width="2"
          stroke-linecap="round" stroke-linejoin="round">
          <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
          <circle cx="12" cy="12" r="3"></circle>
        </svg>
        预览
      </button>
      <button class="btn" id="publishButton">
        <svg class="icon" viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" fill="none" stroke-width="2"
          stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
          <polyline points="17 8 12 3 7 8"></polyline>
          <line x1="12" y1="3" x2="12" y2="15"></line>
        </svg>
        发布
      </button>
    </div>

    <div class="log-wrapper">
      <button class="btn btn-small log-clear-btn" id="clearLogButton">清空日志</button>
      <div class="log-container">
        <div class="log-content" id="log"></div>
      </div>
    </div>
  </div>

  <div class="proxy-mask" id="proxyMask" hidden>
    <div class="proxy-panel">
      <div class="proxy-head">
        <h2>Git 代理</h2>
        <button class="btn btn-small" id="proxyClose">关闭</button>
      </div>
      <div class="proxy-body">
        <label class="proxy-field">
          <span>代理地址（留空表示不使用代理）</span>
          <input id="proxyInput" placeholder="http://host:port" />
        </label>
      </div>
      <div class="proxy-actions">
        <span class="proxy-msg" id="proxyMsg"></span>
        <button class="btn" id="proxySave">保存</button>
      </div>
    </div>
  </div>

  <script>
    // 主题切换功能
    const themeToggle = document.getElementById("themeToggle");
    const html = document.documentElement;
    const moonIcon = document.querySelector(".moon");
    const sunIcon = document.querySelector(".sun");

    // 从 localStorage 获取保存的主题
    const savedTheme = localStorage.getItem("theme") || "light";
    html.setAttribute("data-theme", savedTheme);
    updateThemeIcons(savedTheme);

    themeToggle.addEventListener("click", () => {
      const currentTheme = html.getAttribute("data-theme");
      const newTheme = currentTheme === "dark" ? "light" : "dark";

      html.setAttribute("data-theme", newTheme);
      localStorage.setItem("theme", newTheme);
      updateThemeIcons(newTheme);
    });

    // 更新主题图标显示
    function updateThemeIcons(theme) {
      if (theme === "dark") {
        moonIcon.style.display = "none";
        sunIcon.style.display = "block";
      } else {
        moonIcon.style.display = "block";
        sunIcon.style.display = "none";
      }
    }

    // 检查系统主题偏好
    if (!localStorage.getItem("theme")) {
      const prefersDark = window.matchMedia(
        "(prefers-color-scheme: dark)"
      ).matches;
      const defaultTheme = prefersDark ? "dark" : "light";
      html.setAttribute("data-theme", defaultTheme);
      localStorage.setItem("theme", defaultTheme);
      updateThemeIcons(defaultTheme);
    }
  </script>

  <script>
    // 选择页面元素
    const logElement = document.getElementById("log");
    const pullButton = document.getElementById("pullButton");
    const buildButton = document.getElementById("buildButton");
    const publishButton = document.getElementById("publishButton");
    const previewButton = document.getElementById("previewButton");
    const clearLogButton = document.getElementById("clearLogButton");
    const docsGroup = document.getElementById("docsGroup");
    const proxyButton = document.getElementById("proxyButton");
    const proxyMask = document.getElementById("proxyMask");
    const proxyInput = document.getElementById("proxyInput");
    const proxyMsg = document.getElementById("proxyMsg");
    const proxyClose = document.getElementById("proxyClose");
    const proxySave = document.getElementById("proxySave");
    // WebSocket 连接对象
    let socket;
    // 是否有任务正在执行（用于日志末尾的加载图标）
    let taskRunning = false;
    let statusLine = null;

    async function action(method) {
      const selectedRadio = document.querySelector(
        'input[name="document-type"]:checked'
      );

      if (!selectedRadio) {
        alert("请选中需要操作的文档");
        return;
      }

      try {
        const res = await fetch(window.location.origin + "/" + method, {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
          },
          body: JSON.stringify({
            docs: selectedRadio.value,
          }),
        });
        if (!res.ok) {
          const text = await res.text();
          displayLog(`请求 ${method} 失败 (${res.status}): ${text}`);
        }
      } catch (err) {
        displayLog(`请求 ${method} 失败: ${err.message}`);
      }
    }
    // 日志显示函数
    function scrollLog() {
      // 滚动的容器是 .log-container，而不是里面的 .log-content
      const container = logElement.parentElement;
      container.scrollTop = container.scrollHeight;
    }

    function displayLog(message) {
      const logMessage = document.createElement("div");
      logMessage.textContent = message;
      logElement.appendChild(logMessage);
      // 任务执行中时，保证加载图标始终在最后一行
      if (taskRunning && statusLine) {
        logElement.appendChild(statusLine);
      }
      scrollLog();
    }

    // 任务执行中：在日志末尾显示加载图标；清空日志后仍保留
    function showSpinner() {
      taskRunning = true;
      if (!statusLine) {
        statusLine = document.createElement("div");
        statusLine.className = "log-status";
        const icon = document.createElement("span");
        icon.className = "log-spinner";
        const text = document.createElement("span");
        text.textContent = "任务执行中...";
        statusLine.appendChild(icon);
        statusLine.appendChild(text);
      }
      logElement.appendChild(statusLine);
      scrollLog();
    }

    function hideSpinner() {
      taskRunning = false;
      if (statusLine && statusLine.parentElement) {
        statusLine.parentElement.removeChild(statusLine);
      }
    }

    // 预览地址以可点击链接的形式显示（同一主机，端口来自设置）
    function displayPreviewLink(path) {
      const port = appSettings && appSettings.previewPort ? appSettings.previewPort : 3040;
      const url = `http://${window.location.hostname}:${port}/${path || ""}`;
      const line = document.createElement("div");
      const label = document.createElement("span");
      label.textContent = "预览地址（第一页）：";
      const link = document.createElement("a");
      link.className = "preview-link";
      link.href = url;
      link.target = "_blank";
      link.rel = "noopener noreferrer";
      link.textContent = url;
      line.appendChild(label);
      line.appendChild(link);
      logElement.appendChild(line);
      if (taskRunning && statusLine) {
        logElement.appendChild(statusLine);
      }
      scrollLog();
    }

    // ===== 设置 =====
    let appSettings = null;

    async function loadSettings() {
      try {
        const res = await fetch("/settings");
        if (!res.ok) {
          throw new Error(await res.text());
        }
        appSettings = await res.json();
        renderDocRadios();
      } catch (err) {
        displayLog(`加载设置失败: ${err.message}`);
      }
    }

    function renderDocRadios() {
      if (!appSettings) {
        return;
      }
      const selected = document.querySelector(
        'input[name="document-type"]:checked'
      );
      const selectedValue = selected ? selected.value : null;
      docsGroup.innerHTML = "";
      appSettings.docs.forEach((doc) => {
        const item = document.createElement("div");
        item.className = "radio-item";
        const input = document.createElement("input");
        input.type = "radio";
        input.name = "document-type";
        input.id = `doc-${doc.value}`;
        input.value = doc.value;
        if (selectedValue === doc.value) {
          input.checked = true;
        }
        const label = document.createElement("label");
        label.htmlFor = input.id;
        label.textContent = doc.label;
        item.appendChild(input);
        item.appendChild(label);
        docsGroup.appendChild(item);
      });
    }

    // ===== Git 代理设置 =====
    function openProxy() {
      if (!appSettings) {
        return;
      }
      proxyInput.value = appSettings.gitProxy || "";
      proxyMsg.textContent = "";
      proxyMsg.classList.remove("error");
      proxyMask.hidden = false;
      proxyInput.focus();
    }

    function closeProxy() {
      proxyMask.hidden = true;
    }

    async function saveProxy() {
      if (!appSettings) {
        return;
      }
      proxyMsg.classList.remove("error");
      proxyMsg.textContent = "保存中...";
      try {
        const res = await fetch("/settings", {
          method: "PUT",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            ...appSettings,
            gitProxy: proxyInput.value.trim()
          })
        });
        const text = await res.text();
        if (!res.ok) {
          throw new Error(text);
        }
        appSettings = JSON.parse(text);
        proxyMsg.textContent = "已保存";
        setTimeout(closeProxy, 600);
      } catch (err) {
        proxyMsg.classList.add("error");
        proxyMsg.textContent = `保存失败: ${err.message}`;
      }
    }

    let reconnectTimer = null;

    // 连接 WebSocket 并接收日志，断线后自动重连
    function connectWebSocket() {
      // 如果已有连接，则关闭
      if (socket) {
        socket.onclose = null;
        socket.close();
      }

      // 页面用 https 打开时必须用 wss，否则浏览器会拦截连接
      const protocol = window.location.protocol === "https:" ? "wss" : "ws";
      socket = new WebSocket(`${protocol}://${window.location.host}`);

      socket.onopen = () => {
        // 连接建立后主动查询一次任务状态，刷新/重连后也能恢复加载图标
        socket.send(JSON.stringify({
          cmd: "status"
        }));
      };

      socket.onmessage = (event) => {
        if (!event.data) {
          return;
        }
        try {
          const data = JSON.parse(event.data);
          if (data.job) {
            if (data.job.running) {
              showSpinner();
            } else {
              hideSpinner();
            }
          } else if (data.preview) {
            displayPreviewLink(data.preview.path);
          } else if (data.log !== undefined) {
            displayLog(data.log); // 显示日志
          }
        } catch (err) {
          displayLog(event.data);
        }
      };

      socket.onerror = () => {
        // 浏览器不会提供具体错误信息，onclose 里统一提示并重连
      };

      socket.onclose = () => {
        displayLog("WebSocket 连接已断开，3 秒后自动重连...");
        clearTimeout(reconnectTimer);
        reconnectTimer = setTimeout(connectWebSocket, 3000);
      };
    }

    // 按钮事件处理
    pullButton.addEventListener("click", () => {
      action("pull");
    });

    buildButton.addEventListener("click", () => {
      action("build");
    });
    previewButton.addEventListener("click", () => {
      action("preview");
    });
    publishButton.addEventListener("click", () => {
      action("publish");
    });

    // 清空页面上的日志显示（不影响服务端保存的日志文件）
    clearLogButton.addEventListener("click", () => {
      logElement.innerHTML = "";
      // 任务还在执行时，清空后仍保留末尾的加载图标
      if (taskRunning && statusLine) {
        logElement.appendChild(statusLine);
      }
    });

    proxyButton.addEventListener("click", openProxy);
    proxyClose.addEventListener("click", closeProxy);
    proxySave.addEventListener("click", saveProxy);
    proxyMask.addEventListener("click", (event) => {
      if (event.target === proxyMask) {
        closeProxy();
      }
    });

    loadSettings();
    connectWebSocket();
  </script>
</body>

</html>
